<svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern Gradient Bleed -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glass Frame -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="#0f172a" fill-opacity="0.6" stroke="url(#logoGrad)" stroke-width="2.5" />

  <!-- Integrated P/S Monogram Brackets -->
  <path d="M30 32H58C66 32 70 36 70 42C70 48 66 52 58 52H30V32Z" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M30 52V68" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Inner CLI Terminal Prompt Symbol (Depth) -->
  <path d="M42 58L48 63L42 68" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <line x1="52" y1="68" x2="58" y2="68" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
</svg>
